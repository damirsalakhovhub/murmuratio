<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Murmuratio — Board</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/now.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body class="now-mode">
  <!-- murmuratio-branding -->
  <div class="source-bar">
  <div class="now-title" lang="en"><h1 id="page-title">Agents</h1><p id="now-summary" class="now-summary"></p></div>
  <div class="now-right" lang="en"><p id="now-limits" class="now-limits"></p>
  <div class="now-nav">
  <div class="now-tools" id="now-tools">
    <button id="charts-toggle" class="now-tool" type="button" aria-pressed="false" aria-label="Charts" title="Show charts" hidden><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13.5h12M3.5 11 6.5 7l2.5 2.5 4-5"/></svg></button>
    <button id="columns-toggle" class="now-tool" type="button" aria-expanded="false" aria-controls="columns-menu" aria-haspopup="true" title="Columns"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M6 2.5v11M10 2.5v11"/></svg><span id="columns-hidden-count" class="now-tool-count" hidden></span></button>
    <div id="columns-menu" class="now-menu" role="group" aria-label="Columns" hidden></div>
  </div>
  <nav class="source-tabs" aria-label="Pages">
    <a class="control button" href="/" aria-current="page">Board</a>
    <a class="control button" href="/calculator" hidden>Calculator</a>
  </nav></div></div>
  <p id="now-freshness" role="status" hidden></p>
  </div>
  <main id="now-view" class="now-view" aria-label="Board" lang="en">
    <p id="now-error" role="status" hidden></p>
    <p id="now-reminder" class="now-reminder" role="status" hidden></p>
    <section id="now-forecast" class="now-forecast" aria-label="Weekly limit forecast" hidden></section>
    <div id="now-board" class="now-board"></div>
  </main>
</body>
</html>
